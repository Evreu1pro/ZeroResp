[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "zeroresp"
version = "5.4.4"
description = "ZeroResp v5.4.4: adaptive IPD strategy for Axelrod-Python (noise ladder + cycler contour)"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Evreu1pro" }]
requires-python = ">=3.9"
dependencies = ["axelrod>=4.12.0"]
keywords = ["iterated-prisoners-dilemma", "game-theory", "axelrod", "ipd"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://evreu1pro.github.io/ZeroResp/"
Documentation = "https://evreu1pro.github.io/ZeroResp/"
Source = "https://github.com/Evreu1pro/ZeroResp"
Issues = "https://github.com/Evreu1pro/ZeroResp/issues"
"Axelrod PR" = "https://github.com/Axelrod-Python/Axelrod/pull/1496"

[tool.setuptools]
# Explicit modules only — do not auto-discover the vendored axelrod/ tree.
py-modules = ["zeroresp", "zeroresp_v53", "zeroresp_v544"]
